name: Build iOS package
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Select Xcode 26
        shell: bash
        run: |
          set -e
          XCODE_APP="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1 || true)"
          if [ -z "$XCODE_APP" ]; then
            XCODE_APP="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)"
          fi
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version
      - run: npm install
      - run: npm run build
      - name: Prepare iOS brand assets
        run: |
          set -e
          mkdir -p assets
          node -e "require('fs').writeFileSync('assets/icon-only.png',Buffer.from(require('fs').readFileSync('android/sinvo_logo.b64','utf8'),'base64'))"
          cp assets/icon-only.png assets/icon-foreground.png
          cp assets/icon-only.png assets/icon-background.png
          cp assets/icon-only.png assets/splash.png
          cp assets/icon-only.png assets/splash-dark.png
      - name: Add Capacitor iOS project
        run: npx cap add ios --packagemanager SPM
      - name: Sync web assets and native config
        run: npx cap sync ios
      - name: Generate iOS icons and splash
        run: npx capacitor-assets generate --ios
      - name: Resolve Swift packages
        run: xcodebuild -resolvePackageDependencies -workspace ios/App/App.xcworkspace -scheme App
      - name: Build unsigned iOS archive
        run: |
          set -e
          xcodebuild             -workspace ios/App/App.xcworkspace             -scheme App             -sdk iphoneos             -configuration Release             -archivePath "$PWD/build/Sinvo.xcarchive"             archive             IPHONEOS_DEPLOYMENT_TARGET=15.0             CODE_SIGNING_ALLOWED=NO             CODE_SIGNING_REQUIRED=NO
      - name: Verify archive
        run: |
          test -d build/Sinvo.xcarchive/Products/Applications/App.app
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' build/Sinvo.xcarchive/Products/Applications/App.app/Info.plist
      - name: Package unsigned iOS IPA
        run: |
          set -e
          rm -rf build/Payload build/Sinvo-iOS-unsigned.ipa
          mkdir -p build/Payload
          cp -R build/Sinvo.xcarchive/Products/Applications/App.app build/Payload/Sinvo.app
          cd build
          zip -qry Sinvo-iOS-unsigned.ipa Payload
          test -s Sinvo-iOS-unsigned.ipa
      - name: Publish direct iOS download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ios-latest
          name: Sinvo iOS Latest
          prerelease: true
          make_latest: false
          files: build/Sinvo-iOS-unsigned.ipa
