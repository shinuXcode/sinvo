name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install
      - run: npm run build
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - run: mkdir -p android/app/src/main/res/drawable && base64 -d android/sinvo_logo.b64 > android/app/src/main/res/drawable/sinvo_logo.png
      - run: rm -rf android/app/src/main/assets/web && mkdir -p android/app/src/main/assets/web && cp -r dist/. android/app/src/main/assets/web/
      - run: gradle -p android assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk "Sinvo-Android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: sinvo-android-debug
          path: Sinvo-Android.apk
      - name: Publish direct Android download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Sinvo Android Latest
          prerelease: false
          make_latest: true
          files: Sinvo-Android.apk
