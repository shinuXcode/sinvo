name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22}
      - run: npm install
      - run: npm run build
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: "17"}
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - run: mkdir -p android/app/src/main/assets && cp android/sinvo_logo.svg android/app/src/main/assets/sinvo_logo.svg
      - run: rm -rf android/app/src/main/assets/web && mkdir -p android/app/src/main/assets/web && cp -r dist/. android/app/src/main/assets/web/
      - run: gradle -p android assembleDebug --no-daemon
      - name: Verify APK package and signature
        shell: bash
        run: |
          set -e
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          SDK_BUILD_TOOLS="$ANDROID_HOME/build-tools/35.0.0"
          "$SDK_BUILD_TOOLS/apksigner" verify --verbose "$APK"
          BADGING="$("$SDK_BUILD_TOOLS/aapt2" dump badging "$APK")"
          echo "$BADGING"
          echo "$BADGING" | grep -F "package: name='com.sinvo.shop'"
          echo "$BADGING" | grep -F "versionCode='6'"
          echo "$BADGING" | grep -F "versionName='1.4.1'"
          sha256sum "$APK"
          unzip -t "$APK" >/dev/null
      - name: Read app version
        id: version
        shell: bash
        run: |
          echo "version=$(grep -o 'versionName "[^"]*"' android/app/build.gradle | cut -d'"' -f2)" >> "$GITHUB_OUTPUT"
          echo "version_code=$(grep -o 'versionCode [0-9]*' android/app/build.gradle | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk "Sinvo-Android.apk"
      - uses: actions/upload-artifact@v4
          make_latest: false
          files: Sinvo-Android.apk
      - name: Publish direct Android download
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Sinvo Android Latest
          prerelease: true
          make_latest: false
          files: Sinvo-Android.apk
      - name: Refresh website version history
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          mkdir -p public
          gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" --jq '[.[] | select(.draft == false) | select(.tag_name | startswith("v")) | {version:(.tag_name | ltrimstr("v")),tag:.tag_name,name:.name,platform:"Android",publishedAt:.published_at,latest:(.tag_name == ("v"+env.VERSION)),download:(if .tag_name == ("v"+env.VERSION) then "/api/download-apk" else .assets[0].browser_download_url end),release:.html_url,notes:(.body // "Production Android build for Sinvo: offline inventory, billing, barcode scanning, CSV import, verified backup/restore, and direct website APK download.")}] | sort_by(.publishedAt) | reverse' > public/versions.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/versions.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "chore: refresh version history [skip ci]"
          git push
