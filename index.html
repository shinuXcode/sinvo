<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0b1220"><title>Sinvo</title><style>
*{box-sizing:border-box}body{margin:0;font:14px system-ui;background:#f5f7fb;color:#101828}.side{position:fixed;width:220px;inset:0 auto 0 0;background:#0b1220;color:#fff;padding:16px}.brand{font-size:22px;font-weight:800;padding:8px}.brand small{display:block;color:#94a3b8;font-size:10px}.nav button{width:100%;padding:10px;border:0;border-radius:8px;background:none;color:#b8c4d6;text-align:left;margin:2px 0}.nav button.active,.nav button:hover{background:#1b2940;color:#fff}.main{margin-left:220px;padding:20px;max-width:1500px}.top{display:flex;justify-content:space-between;gap:10px;align-items:center}.top h1{margin:0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card,.tablewrap{background:#fff;border:1px solid #e4e7ec;border-radius:12px;padding:15px;box-shadow:0 5px 20px #00000008}.stat b{font-size:24px;display:block;margin:5px 0}.muted{color:#667085;font-size:12px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.field{border:1px solid #d0d5dd;border-radius:8px;padding:9px;background:#fff}.search{flex:1;min-width:220px}.btn{border:1px solid #d0d5dd;border-radius:8px;background:#fff;padding:8px 11px}.primary{background:#2563eb;border-color:#2563eb;color:#fff}.danger{background:#dc2626;border-color:#dc2626;color:#fff}.section{display:none}.section.active{display:block}.tablewrap{padding:0;overflow:auto}.table{width:100%;border-collapse:collapse;min-width:700px}.table th,.table td{padding:10px;border-bottom:1px solid #eaecf0;text-align:left}.table th{background:#f9fafb}.pill{font-size:11px;padding:3px 7px;border-radius:99px}.warn{background:#fef3c7;color:#92400e}.bad{background:#fee2e2;color:#991b1b}.modal{display:none;position:fixed;inset:0;background:#0008;align-items:center;justify-content:center;padding:15px;z-index:10}.modal.show{display:flex}.box{background:#fff;border-radius:12px;padding:18px;width:min(700px,100%);max-height:90vh;overflow:auto}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}.label{display:block;font-size:12px;font-weight:650;margin-bottom:4px}.empty{text-align:center;padding:35px;color:#667085}@media(max-width:800px){.side{display:none}.main{margin:0;padding:14px}.grid{grid-template-columns:1fr 1fr}.form{grid-template-columns:1fr}}
</style></head><body>
<aside class="side"><div class="brand">SINVO<small>Offline Shop Manager</small></div><div id="nav" class="nav"></div></aside>
<main class="main"><div class="top"><div><h1 id="title">Dashboard</h1><span id="net" class="muted"></span></div><div class="toolbar"><button class="btn primary" onclick="newSale()">+ Sale</button></div></div>
<div id="dashboard" class="section active"></div><div id="products" class="section"></div><div id="sales" class="section"></div><div id="purchases" class="section"></div><div id="customers" class="section"></div><div id="expenses" class="section"></div><div id="reports" class="section"></div><div id="settings" class="section"></div></main>
<div id="modal" class="modal"><div id="box" class="box"></div></div>
<script>
var D={settings:{shop:"My Shop",phone:"",address:"",currency:"₹",prefix:"INV"},products:[],sales:[],purchases:[],customers:[],expenses:[],stock:[]};
var db=load(),page="dashboard",draft=[];
function load(){try{return Object.assign({},D,JSON.parse(localStorage.sinvo||"{}"))}catch(e){return JSON.parse(JSON.stringify(D))}}
function save(){localStorage.sinvo=JSON.stringify(db)}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2)}
function money(n){return (db.settings.currency||"₹")+" "+Number(n||0).toLocaleString("en-IN",{minimumFractionDigits:2,maximumFractionDigits:2})}
function esc(x){return String(x==null?"":x).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function today(){return new Date().toISOString().slice(0,10)}
function toast(s){var t=document.getElementById("toast");if(!t){t=document.createElement("div");t.id="toast";t.style="position:fixed;right:15px;bottom:15px;background:#101828;color:#fff;padding:10px 14px;border-radius:8px;z-index:50";document.body.appendChild(t)}t.textContent=s;setTimeout(function(){t.remove()},2200)}
var menus=[["dashboard","Dashboard"],["products","Products"],["sales","Sales & Bills"],["purchases","Purchases"],["customers","Customers"],["expenses","Expenses"],["reports","Reports"],["settings","Settings"]];
function nav(){document.getElementById("nav").innerHTML=menus.map(function(m){return '<button class="'+(page==m[0]?"active":"")+'" onclick="go(\''+m[0]+'\')">'+m[1]+"</button>"}).join("")}
function go(p){page=p;document.querySelectorAll(".section").forEach(function(x){x.classList.remove("active")});document.getElementById(p).classList.add("active");document.getElementById("title").textContent=menus.filter(function(x){return x[0]==p})[0][1];nav();render()}
function stat(a,b,c){return '<div class="card stat"><span class="muted">'+a+'</span><b>'+b+'</b><span class="muted">'+c+"</span></div>"}
function table(head,rows,empty){if(!rows.length)return '<div class="empty">'+(empty||"No records")+"</div>";return '<div class="tablewrap"><table class="table"><thead><tr>'+head.map(function(x){return "<th>"+x+"</th>"}).join("")+'</tr></thead><tbody>'+rows.map(function(r){return "<tr>"+r.map(function(x){return "<td>"+x+"</td>"}).join("")+"</tr>"}).join("")+"</tbody></table></div>"}
function render(){document.getElementById("net").textContent=navigator.onLine?"Online":"Offline — local data active";({dashboard:dash,products:showProducts,sales:showSales,purchases:showPurchases,customers:showCustomers,expenses:showExpenses,reports:showReports,settings:showSettings})[page]()}
function dash(){var rev=db.sales.reduce(function(a,x){return a+x.total},0),pur=db.purchases.reduce(function(a,x){return a+x.total},0),ex=db.expenses.reduce(function(a,x){return a+x.amount},0);document.getElementById("dashboard").innerHTML='<div class="grid">'+stat("Sales",money(rev),"All bills")+stat("Purchases",money(pur),"Supplier purchases")+stat("Expenses",money(ex),"Operating costs")+stat("Products",db.products.length,"Catalog")+'</div><div class="card" style="margin-top:12px"><b>Low stock</b>'+table(["Product","SKU","Stock","Alert","Status"],db.products.filter(function(p){return p.qty<=p.alert}).map(function(p){return[esc(p.name),esc(p.sku),p.qty,p.alert,'<span class="pill '+(p.qty?"warn":"bad")+'">'+(p.qty?"Low":"Out")+"</span>"]}),"No low-stock items.")+"</div>"}
function showProducts(){var q=(document.getElementById("pq")||{}).value||"",a=db.products.filter(function(p){return(p.name+" "+p.sku+" "+p.barcode+" "+p.category).toLowerCase().indexOf(q.toLowerCase())>=0});document.getElementById("products").innerHTML='<div class="toolbar"><input id="pq" class="field search" placeholder="Search name, SKU, barcode, category..." value="'+esc(q)+'" oninput="showProducts()"><button class="btn primary" onclick="product()">+ Product</button><button class="btn" onclick="adjust()">Stock adjustment</button></div>'+table(["Name","SKU","Category","Buy","Sell","Stock","Alert","Actions"],a.map(function(p){return[esc(p.name),esc(p.sku||"—"),esc(p.category||"—"),money(p.buy),money(p.sell),p.qty,p.alert,'<button class="btn" onclick="product(\''+p.id+'\')">Edit</button> <button class="btn danger" onclick="delProduct(\''+p.id+'\')">Delete</button>']}),"No products.")}
function showSales(){var q=(document.getElementById("sq")||{}).value||"",a=db.sales.filter(function(s){return(s.invoice+" "+s.customer+" "+s.date).toLowerCase().indexOf(q.toLowerCase())>=0});document.getElementById("sales").innerHTML='<div class="toolbar"><input id="sq" class="field search" placeholder="Search invoice, customer, date..." value="'+esc(q)+'" oninput="showSales()"><button class="btn primary" onclick="newSale()">+ New sale</button></div>'+table(["Invoice","Date","Customer","Items","Payment","Total",""],a.slice().reverse().map(function(s){return[esc(s.invoice),s.date,esc(s.customer),s.items.length,esc(s.payment),money(s.total),'<button class="btn" onclick="viewSale(\''+s.id+'\')">View</button> <button class="btn danger" onclick="voidSale(\''+s.id+'\')">Void</button>']}),"No sales.")}
function showPurchases(){document.getElementById("purchases").innerHTML='<div class="toolbar"><button class="btn primary" onclick="purchase()">+ Purchase</button></div>'+table(["Date","Supplier","Invoice","Items","Total",""],db.purchases.slice().reverse().map(function(p){return[p.date,esc(p.supplier||"—"),esc(p.invoice||"—"),p.items.length,money(p.total),'<button class="btn" onclick="viewPurchase(\''+p.id+'\')">View</button> <button class="btn danger" onclick="delPurchase(\''+p.id+'\')">Delete</button>']}),"No purchases.")}
function showCustomers(){var q=(document.getElementById("cq")||{}).value||"",a=db.customers.filter(function(c){return(c.name+" "+c.phone).toLowerCase().indexOf(q.toLowerCase())>=0});document.getElementById("customers").innerHTML='<div class="toolbar"><input id="cq" class="field search" placeholder="Search customers..." value="'+esc(q)+'" oninput="showCustomers()"><button class="btn primary" onclick="customer()">+ Customer</button></div>'+table(["Name","Phone","Address","Outstanding",""],a.map(function(c){return[esc(c.name),esc(c.phone||"—"),esc(c.address||"—"),money(c.due||0),'<button class="btn" onclick="customer(\''+c.id+'\')">Edit</button> <button class="btn danger" onclick="delCustomer(\''+c.id+'\')">Delete</button>']}),"No customers.")}
function showExpenses(){document.getElementById("expenses").innerHTML='<div class="toolbar"><button class="btn primary" onclick="expense()">+ Expense</button></div>'+table(["Date","Category","Note","Amount",""],db.expenses.slice().reverse().map(function(e){return[e.date,esc(e.category),esc(e.note||"—"),money(e.amount),'<button class="btn danger" onclick="delExpense(\''+e.id+'\')">Delete</button>']}),"No expenses.")}
function showReports(){var rev=db.sales.reduce(function(a,x){return a+x.total},0),pur=db.purchases.reduce(function(a,x){return a+x.total},0),ex=db.expenses.reduce(function(a,x){return a+x.amount},0),sv=db.products.reduce(function(a,x){return a+x.qty*x.sell},0),days={};db.sales.forEach(function(s){days[s.date]=(days[s.date]||0)+s.total});document.getElementById("reports").innerHTML='<div class="grid">'+stat("Revenue",money(rev),"Sales")+stat("Stock value",money(sv),"At selling price")+stat("After purchases",money(rev-pur),"Revenue − purchases")+stat("Net cash",money(rev-pur-ex),"Revenue − purchases − expenses")+'</div><div class="card" style="margin-top:12px"><b>Daily sales</b>'+table(["Date","Revenue"],Object.keys(days).sort().reverse().map(function(d){return[d,money(days[d])]}),"No sales.")+"</div>"}
function showSettings(){var s=db.settings;document.getElementById("settings").innerHTML='<div class="card"><h3>Shop settings</h3><div class="form"><div><label class="label">Shop name</label><input id="shop" class="field" value="'+esc(s.shop)+'"></div><div><label class="label">Phone</label><input id="phone" class="field" value="'+esc(s.phone)+'"></div><div class="full"><label class="label">Address</label><textarea id="address" class="field" style="width:100%">'+esc(s.address)+'</textarea></div><div><label class="label">Currency</label><input id="currency" class="field" value="'+esc(s.currency)+'"></div><div><label class="label">Invoice prefix</label><input id="prefix" class="field" value="'+esc(s.prefix)+'"></div></div><br><button class="btn primary" onclick="saveSettings()">Save settings</button></div><div class="card" style="margin-top:12px"><h3>Local data</h3><p class="muted">All shop data stays on this device in local storage. No backend, cloud backup, or account is required.</p></div><div class="card" style="margin-top:12px"><b>Danger zone</b><br><button class="btn danger" onclick="resetAll()">Delete all local data</button></div>'}
function openModal(title,body,action){document.getElementById("box").innerHTML='<div style="display:flex;justify-content:space-between"><h2>'+title+'</h2><button class="btn" onclick="closeModal()">✕</button></div>'+body+'<div class="toolbar" style="justify-content:flex-end"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="'+action+'">Save</button></div>';document.getElementById("modal").classList.add("show")}
function closeModal(){document.getElementById("modal").classList.remove("show")}
function product(i){var p=db.products.filter(function(x){return x.id==i})[0]||{id:"",name:"",sku:"",barcode:"",category:"",buy:0,sell:0,qty:0,alert:5};openModal(i?"Edit product":"Add product",'<div class="form"><div class="full"><label class="label">Name *</label><input id="pn" class="field" value="'+esc(p.name)+'"></div><div><label class="label">SKU</label><input id="psku" class="field" value="'+esc(p.sku)+'"></div><div><label class="label">Barcode</label><input id="pbar" class="field" value="'+esc(p.barcode)+'"></div><div><label class="label">Category</label><input id="pcat" class="field" value="'+esc(p.category)+'"></div><div><label class="label">Buy price</label><input id="pbuy" type="number" class="field" value="'+p.buy+'"></div><div><label class="label">Sell price</label><input id="psell" type="number" class="field" value="'+p.sell+'"></div><div><label class="label">Stock</label><input id="pqty" type="number" class="field" value="'+p.qty+'"></div><div><label class="label">Low stock alert</label><input id="palert" type="number" class="field" value="'+p.alert+'"></div></div>','saveProduct(\''+(i||"")+'\')')}
function saveProduct(i){var name=document.getElementById("pn").value.trim();if(!name)return toast("Product name required");var old=db.products.filter(function(x){return x.id==i})[0],p={id:i||uid(),name:name,sku:psku.value.trim(),barcode:pbar.value.trim(),category:pcat.value.trim(),buy:+pbuy.value||0,sell:+psell.value||0,qty:+pqty.value||0,alert:+palert.value||0};if(old&&old.qty!=p.qty)stockLog(p.id,p.qty-old.qty,"edit");if(!old)stockLog(p.id,p.qty,"opening");if(old)db.products[db.products.indexOf(old)]=p;else db.products.push(p);save();closeModal();render()}
function viewSale(i){var s=db.sales.filter(function(x){return x.id==i})[0];var body='<div id="invoice"><h2>'+esc(db.settings.shop)+'</h2><div class="muted">'+esc(db.settings.address)+'<br>'+esc(db.settings.phone)+'</div><p><b>'+esc(s.invoice)+'</b> — '+s.date+'<br>Customer: '+esc(s.customer)+'</p>'+table(["Item","Qty","Price","Amount"],s.items.map(function(x){return[esc(x.name),x.qty,money(x.price),money(x.qty*x.price)]}))+'<h3 style="text-align:right">Total '+money(s.total)+'</h3><p style="text-align:right">Payment: '+esc(s.payment)+'</p></div>';openModal("Invoice "+s.invoice,body,"printInvoice()")}
function stockLog(pid,delta,reason){db.stock.push({id:uid(),date:new Date().toISOString(),productId:pid,delta:delta,reason:reason})}
function adjust(){openModal("Stock adjustment",'<div class="form"><div class="full"><label class="label">Product</label><select id="ap" class="field">'+db.products.map(function(p){return'<option value="'+p.id+'">'+esc(p.name)+" — "+p.qty+"</option>"}).join("")+'</select></div><div><label class="label">Change (+/-)</label><input id="aq" type="number" class="field" value="1"></div><div><label class="label">Reason</label><input id="ar" class="field"></div></div>','applyAdjust()')}
function applyAdjust(){var p=db.products.filter(function(x){return x.id==ap.value})[0],q=+aq.value||0;if(!p||p.qty+q<0)return toast("Invalid stock change");p.qty+=q;stockLog(p.id,q,ar.value||"adjustment");save();closeModal();render()}
function newSale(){draft=[];openModal("New sale",'<div class="form"><div><label class="label">Customer</label><select id="sc" class="field"><option value="">Walk-in</option>'+db.customers.map(function(c){return'<option value="'+c.id+'">'+esc(c.name)+"</option>"}).join("")+'</select></div><div><label class="label">Payment</label><select id="sp" class="field"><option>Cash</option><option>UPI</option><option>Card</option><option>Credit</option></select></div><div class="full"><label class="label">Product</label><select id="si" class="field">'+db.products.map(function(p){return'<option value="'+p.id+'">'+esc(p.name)+" — "+money(p.sell)+" (stock "+p.qty+")</option>"}).join("")+'</select></div><div><label class="label">Quantity</label><input id="sqty" type="number" min="1" class="field" value="1"></div><div><label class="label">Discount</label><input id="disc" type="number" min="0" class="field" value="0"></div><div class="full"><button class="btn" onclick="addSaleItem()">Add item</button></div><div id="saleitems" class="full">No items.</div></div>','saveSale()')}
function addSaleItem(){var p=db.products.filter(function(x){return x.id==si.value})[0],q=+sqty.value||1;if(!p||q>p.qty)return toast("Not enough stock");draft.push({productId:p.id,name:p.name,qty:q,price:p.sell});document.getElementById("saleitems").innerHTML=table(["Item","Qty","Price","Amount"],draft.map(function(x){return[esc(x.name),x.qty,money(x.price),money(x.qty*x.price)]}))}
function saveSale(){if(!draft.length)return toast("Add an item");var sub=draft.reduce(function(a,x){return a+x.qty*x.price},0),d=+disc.value||0,total=Math.max(0,sub-d),c=db.customers.filter(function(x){return x.id==sc.value})[0],inv=(db.settings.prefix||"INV")+"-"+String(db.sales.length+1).padStart(5,"0"),s={id:uid(),invoice:inv,date:today(),customer:c?c.name:"Walk-in",customerId:c?c.id:"",payment:sp.value,items:draft.slice(),subtotal:sub,discount:d,total:total};for(var j=0;j<draft.length;j++){var p=db.products.filter(function(x){return x.id==draft[j].productId})[0];if(!p||p.qty<draft[j].qty)return toast("Stock changed");p.qty-=draft[j].qty;stockLog(p.id,-draft[j].qty,"sale "+inv)}db.sales.push(s);if(c&&s.payment=="Credit")c.due=(c.due||0)+total;save();closeModal();viewSale(s.id)}
function printInvoice(){var w=window.open("","_blank");w.document.write("<html><body style='font-family:Arial;padding:25px'>"+document.getElementById("invoice").innerHTML+"</body></html>");w.document.close();w.print()}
function voidSale(i){var s=db.sales.filter(function(x){return x.id==i})[0];if(!s||!confirm("Void sale and restore stock?"))return;s.items.forEach(function(x){var p=db.products.filter(function(y){return y.id==x.productId})[0];if(p){p.qty+=x.qty;stockLog(p.id,x.qty,"void "+s.invoice)}});if(s.customerId&&s.payment=="Credit"){var c=db.customers.filter(function(x){return x.id==s.customerId})[0];if(c)c.due=Math.max(0,(c.due||0)-s.total)}db.sales=db.sales.filter(function(x){return x.id!=i});save();render()}
function purchase(){draft=[];openModal("New purchase",'<div class="form"><div><label class="label">Supplier</label><input id="sup" class="field"></div><div><label class="label">Invoice</label><input id="pinv" class="field"></div><div class="full"><label class="label">Product</label><select id="pi" class="field">'+db.products.map(function(p){return'<option value="'+p.id+'">'+esc(p.name)+"</option>"}).join("")+'</select></div><div><label class="label">Quantity</label><input id="pqty2" type="number" class="field" value="1"></div><div><label class="label">Cost/unit</label><input id="cost" type="number" class="field" value="0"></div><div class="full"><button class="btn" onclick="addPurchaseItem()">Add item</button></div><div id="purchaseitems" class="full">No items.</div></div>','savePurchase()')}
function addPurchaseItem(){var p=db.products.filter(function(x){return x.id==pi.value})[0],q=+pqty2.value||1,c=+cost.value||0;if(!p)return;draft.push({productId:p.id,name:p.name,qty:q,cost:c});purchaseitems.innerHTML=table(["Item","Qty","Cost","Amount"],draft.map(function(x){return[esc(x.name),x.qty,money(x.cost),money(x.qty*x.cost)]}))}
function savePurchase(){if(!draft.length)return toast("Add an item");var total=draft.reduce(function(a,x){return a+x.qty*x.cost},0),p={id:uid(),date:today(),supplier:sup.value.trim(),invoice:pinv.value.trim(),items:draft.slice(),total:total};db.purchases.push(p);draft.forEach(function(x){var pr=db.products.filter(function(y){return y.id==x.productId})[0];if(pr){pr.qty+=x.qty;if(x.cost)pr.buy=x.cost;stockLog(pr.id,x.qty,"purchase "+p.invoice)}});save();closeModal();render()}
function viewPurchase(i){var p=db.purchases.filter(function(x){return x.id==i})[0];openModal("Purchase","Supplier: "+esc(p.supplier)+"<br>Invoice: "+esc(p.invoice)+"<br>"+table(["Item","Qty","Cost","Amount"],p.items.map(function(x){return[esc(x.name),x.qty,money(x.cost),money(x.qty*x.cost)]}))+"<h3>Total "+money(p.total)+"</h3>","closeModal()")}
function delPurchase(i){var p=db.purchases.filter(function(x){return x.id==i})[0];if(!p||!confirm("Delete purchase and reverse stock?"))return;p.items.forEach(function(x){var pr=db.products.filter(function(y){return y.id==x.productId})[0];if(pr)pr.qty=Math.max(0,pr.qty-x.qty);stockLog(x.productId,-x.qty,"void purchase")});db.purchases=db.purchases.filter(function(x){return x.id!=i});save();render()}
function customer(i){var c=db.customers.filter(function(x){return x.id==i})[0]||{id:"",name:"",phone:"",address:"",due:0};openModal(i?"Edit customer":"Add customer",'<div class="form"><div><label class="label">Name</label><input id="cn" class="field" value="'+esc(c.name)+'"></div><div><label class="label">Phone</label><input id="cp" class="field" value="'+esc(c.phone)+'"></div><div class="full"><label class="label">Address</label><textarea id="ca" class="field" style="width:100%">'+esc(c.address)+'</textarea></div><div><label class="label">Outstanding</label><input id="cd" type="number" class="field" value="'+(c.due||0)+'"></div></div>','saveCustomer(\''+(i||"")+'\')')}
function saveCustomer(i){if(!cn.value.trim())return toast("Name required");var c={id:i||uid(),name:cn.value.trim(),phone:cp.value.trim(),address:ca.value.trim(),due:+cd.value||0},o=db.customers.filter(function(x){return x.id==i})[0];if(o)db.customers[db.customers.indexOf(o)]=c;else db.customers.push(c);save();closeModal();render()}
function delCustomer(i){if(confirm("Delete customer?")){db.customers=db.customers.filter(function(x){return x.id!=i});save();render()}}
function expense(){openModal("Add expense",'<div class="form"><div><label class="label">Category</label><input id="ec" class="field"></div><div><label class="label">Amount</label><input id="ea" type="number" class="field"></div><div class="full"><label class="label">Note</label><textarea id="en" class="field" style="width:100%"></textarea></div></div>','saveExpense()')}
function saveExpense(){var a=+ea.value||0;if(a<=0)return toast("Invalid amount");db.expenses.push({id:uid(),date:today(),category:ec.value.trim()||"General",amount:a,note:en.value.trim()});save();closeModal();render()}
function delExpense(i){if(confirm("Delete expense?")){db.expenses=db.expenses.filter(function(x){return x.id!=i});save();render()}}
function saveSettings(){db.settings={shop:shop.value.trim()||"My Shop",phone:phone.value.trim(),address:address.value.trim(),currency:currency.value.trim()||"₹",prefix:prefix.value.trim()||"INV"};save();toast("Settings saved");render()}
function resetAll(){if(confirm("Delete ALL local shop data?")){db=JSON.parse(JSON.stringify(D));save();render();toast("Data cleared")}}
nav();render();if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js");
</script></body></html>
