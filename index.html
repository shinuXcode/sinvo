<!doctype html><html><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/><meta name="theme-color" content="#0b1020"/><meta name="description" content="Sinvo — Android-first offline shop inventory and billing application."/><link rel="icon" href="/sinvo-logo.svg"/><title>Sinvo — Offline Shop Management</title></head><body><div id="root"></div><script>/* Remove any legacy web service worker/cache before loading the showcase. */
if("serviceWorker" in navigator){navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister())).catch(()=>{});}
